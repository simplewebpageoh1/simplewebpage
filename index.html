<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple One-Page Templates</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Poppins:wght@400;600;800&family=Montserrat:wght@400;600;800&family=Merriweather:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ✅ Netlify Forms detection (build-time) -->
    <form
      name="contact"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <textarea name="message"></textarea>

      <!-- 선택 정보들(기록용) -->
      <input name="industryId" />
      <input name="industryOther" />
      <input name="industry" />
      <input name="template" />
      <input name="theme" />
      <input name="selectionSummary" />
      <input name="selectionJson" />
    </form>
    <!-- ✅ Netlify Forms detection (build-time) - intake -->
    <form name="intake" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="intake" />
      <input name="bot-field" />

      <input name="template" />
      <input name="theme" />
      <input name="addons" />

      <input name="businessName" />
      <input name="contactName" />
      <input name="email" />
      <input name="phone" />

      <textarea name="services"></textarea>
      <textarea name="about"></textarea>

      <input name="logoLink" />
      <textarea name="notes"></textarea>
      <input name="layoutOrderRequest" />

      <input name="addon_google_business" />
      <input name="addon_review_request" />
      <input name="addon_copy_refinement" />
      <input name="addon_domain_connection" />
      <input name="addon_additional_revisions" />

      <input name="addonsDisplay" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
